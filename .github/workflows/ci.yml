name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: caesai_test
          POSTGRES_PASSWORD: caes-ai-test-password
          POSTGRES_DB: caesai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caesai_test -d caesai_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CAES_AI_TEST_DATABASE_URL: postgresql://caesai_test:caes-ai-test-password@127.0.0.1:5432/caesai_test
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Use npm 11.19.1
        run: npm install --global npm@11.19.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Verify dependency tree
        run: npm run deps:check
      - name: Restore .NET dependencies
        run: dotnet restore apps/todo-app/UCDavis.CaesAi.Todo.slnx
      - name: Build applications and packages
        run: npm run build
      - name: Check TypeScript types
        run: npm run typecheck
      - name: Check database migrations
        run: npm run db:check
      - name: Lint JavaScript and TypeScript
        run: npm run lint
      - name: Check .NET formatting
        run: npm run format:check
      - name: Test JavaScript packages and PostgreSQL persistence
        run: npm run test:js
      - name: Test .NET SDK and Todo API
        run: npm run test:dotnet
      - name: Test Azure bootstrap CLI without cloud access
        run: npm run test:azure
      - name: Compile Azure Bicep templates
        run: |
          az bicep install --version v0.46.1
          az bicep build --file infrastructure/azure/main.bicep --outfile "$RUNNER_TEMP/caes-ai-main.json"
          az bicep build --file infrastructure/azure/bootstrap.bicep --outfile "$RUNNER_TEMP/caes-ai-bootstrap.json"
      - name: Verify the App Service package against PostgreSQL
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          npm run pack:server
          node scripts/azure/smoke-package.mjs
      - name: Verify package creation without publishing
        run: |
          npm run pack:protocol
          npm run pack:assistant
          npm run pack:dotnet
