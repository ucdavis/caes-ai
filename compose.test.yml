name: caes-ai-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: caesai_test
      POSTGRES_PASSWORD: caes-ai-test-password
      POSTGRES_DB: caesai_test
    ports:
      - "127.0.0.1:54330:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caesai_test -d caesai_test"]
      interval: 2s
      timeout: 3s
      retries: 30
